<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Wollok AutoGrader</h1>
</header>
<main>
    <h2>Resultado de la corrección</h2>
    <p>
        <strong>Correcto:</strong>
        <span th:text="${result.success}"></span>

    <p>
        <strong>Salida:</strong>
        <span th:text="${result.output}"></span>
    </p>
    <hr>
    <a href="/">Volver</a>
</main>
<footer>
    Versión 0.0.1
</footer>
</body>
</html>
